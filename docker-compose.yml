services:
  # 1. KARDUS DATABASE
  db:
    image: postgres:15-alpine
    container_name: manufacturing-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: manufacturing_ai_system
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. KARDUS APLIKASI AI (Streamlit)
  app:
    build: .
    container_name: manufacturing-app
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=manufacturing_ai_system
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - db

  # 3. KARDUS MQTT BROKER (BARU DITAMBAHKAN)
  mqtt-broker:
    image: eclipse-mosquitto:latest
    container_name: mqtt-broker
    ports:
      - "127.0.0.1:1883:1883"

  # 4. KARDUS GATEWAY (IOT)
  gateway:
    build: .
    container_name: manufacturing-gateway
    command: python gateway.py
    volumes:
      - .:/app
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=manufacturing_ai_system
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - MQTT_HOST=mqtt-broker
    depends_on:
      - db
      - mqtt-broker

volumes:
  postgres_data: